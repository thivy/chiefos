<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChiefOS is a digital chief of staff for Microsoft 365." />
    <title>ChiefOS</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        background: linear-gradient(135deg, var(--cp-bg), var(--cp-bg-elevated));
        color: var(--cp-text);
        font-family:
          "Segoe UI",
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      main {
        display: grid;
        width: min(100% - 48px, 1120px);
        margin: auto;
        padding-block: 48px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 28px;
        color: var(--cp-accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 36px;
        height: 2px;
        background: var(--cp-accent);
        content: "";
      }

      h1 {
        max-width: 900px;
        margin: 0;
        font-size: clamp(4rem, 12vw, 9rem);
        font-weight: 650;
        letter-spacing: 0;
        line-height: 0.86;
      }

      .period {
        color: var(--cp-accent);
      }

      .message {
        max-width: 560px;
        margin: 40px 0 0;
        color: var(--cp-text-muted);
        font-size: clamp(1.125rem, 2vw, 1.5rem);
        line-height: 1.5;
      }

      footer {
        position: fixed;
        right: 24px;
        bottom: 20px;
        color: var(--cp-text-soft);
        font-size: 0.8125rem;
      }

      @media (max-width: 560px) {
        main {
          width: min(100% - 32px, 1120px);
          padding-block: 32px 72px;
        }

        h1 {
          font-size: clamp(3.5rem, 23vw, 6rem);
        }

        .message {
          margin-top: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Digital chief of staff</p>
      <h1>Chief<br />OS<span class="period">.</span></h1>
      <p class="message">A clearer start to every day. More is coming soon.</p>
    </main>
    <footer>Microsoft 365, thoughtfully organized.</footer>
  </body>
</html>
